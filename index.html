<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOHN MELO — PORTFOLIO</title>
  <link rel="icon" type="image/png" href="./assets/face.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/main-CSUzN3p3.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="stylesheet" crossorigin href="./assets/main-DMuQRqzZ.css">
</head>
<body>
  
  <!-- GLOBAL NAVBAR -->
  <nav class="global-navbar">
    <div class="nav-brand">
      <a href="#" onclick="navigate('home.html')">JOHN MELO</a>
    </div>
    
    <div class="hamburger" id="hamburger-btn">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="nav-links" id="nav-links">
      <a href="#" onclick="navigate('home.html')">HOME</a>
      <a href="#" onclick="navigateCategory('artworks')">ARTWORKS</a>
      <a href="#" onclick="navigateCategory('videos')">VIDEOS</a>
      <a href="#" onclick="navigateCategory('photos')">PHOTOS</a>
      <a href="#" onclick="navigate('audios.html')">AUDIOS</a>
      <a href="#" onclick="navigate('about.html')" class="nav-highlight">ABOUT ME</a>
      <a href="#" onclick="navigate('experience.html')" class="nav-exp">EXPERIENCE</a>
    </div>
  </nav>

  <!-- IFRAME FOR CONTENT -->
  <div class="iframe-container">
    <iframe id="main-frame" src="./home.html"></iframe>
  </div>

  <!-- GLOBAL AUDIO PLAYER -->
  <footer class="player-bar hidden" id="player-bar">
    <div class="player-info">
      <img id="player-artwork" src="./assets/face.png" alt="Artwork" />
      <div class="player-text">
        <h3 id="player-title">Track Title</h3>
        <p id="player-artist">JOHN MELO</p>
      </div>
    </div>
    
    <div class="player-controls-container">
      <div class="player-controls">
        <button id="btn-prev" class="control-btn">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play-pause" class="play-pause-btn">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-next" class="control-btn">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      
      <div class="player-progress">
        <span id="time-current">0:00</span>
        <div class="progress-bar-bg" id="progress-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>
    
    <div class="player-spacer"></div>
  </footer>

  <!-- Hidden SoundCloud Widget -->
  <iframe id="sc-widget" width="0" height="0" style="position:absolute;left:-9999px;top:-9999px;" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/johnmelo_putoexperimental/sets/perpetualization-2&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false"></iframe>

  <script src="https://w.soundcloud.com/player/api.js"></script>
</body>
</html>
