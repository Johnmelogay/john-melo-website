<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOHN MELO — ADMIN SYSTEM</title>
  <link rel="icon" type="image/png" href="./assets/face.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --accent-red: #ff1a1a;
    }
    body {
      background: var(--bg-color);
      color: #f0f0e8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      background: #111;
      padding: 40px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }
    h1 {
      margin-top: 0;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.05em;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: 10px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group.hidden {
      display: none;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: #aaa;
    }
    input[type="text"],
    input[type="number"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #444;
      color: #f0f0e8;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-red);
    }
    input[type="file"] {
      background: #0a0a0a;
      padding: 10px;
      width: 100%;
      border: 1px dashed #444;
      box-sizing: border-box;
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }
    button[type="submit"] {
      width: 100%;
      padding: 15px;
      background: var(--accent-red);
      color: white;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 4px;
    }
    button[type="submit"]:hover {
      background: #cc0000;
    }
    button[type="submit"]:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      text-align: center;
      font-family: monospace;
      color: #aaa;
    }
    .success { color: #00ff41 !important; }
    .error { color: #ff3333 !important; }
    .hint {
      font-size: 0.75rem;
      color: #666;
      margin-top: 6px;
    }
  </style>
  <script type="module" crossorigin src="./assets/admin-CTtH8AIC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="./assets/firebase-multiplayer-kLE0Tx7F.js">
</head>
<body>
  <div class="admin-container">
    <h1>SYS_UPLOAD</h1>
    <form id="upload-form">
      
      <div class="form-group">
        <label for="category">CATEGORIA</label>
        <select id="category" required>
          <option value="artworks">ARTWORKS</option>
          <option value="videos">VIDEOS</option>
          <option value="photos">PHOTOS</option>
          <option value="audios">AUDIOS</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title">TÍTULO</label>
        <input type="text" id="title" placeholder="Nome da obra" required />
      </div>

      <div class="form-group">
        <label for="year">ANO</label>
        <input type="number" id="year" placeholder="2024" min="1900" max="2099" />
      </div>

      <div class="form-group">
        <label for="description">DESCRIÇÃO (Opcional)</label>
        <textarea id="description" rows="3" placeholder="Material, contexto..."></textarea>
      </div>

      <!-- AUDIO: SoundCloud link -->
      <div class="form-group hidden" id="group-soundcloud">
        <label for="soundcloud-link">LINK DO SOUNDCLOUD</label>
        <input type="url" id="soundcloud-link" placeholder="https://soundcloud.com/..." />
        <p class="hint">Cole o link direto da faixa no SoundCloud.</p>
      </div>

      <!-- MEDIA: Toggle between file upload and public link -->
      <div class="form-group" id="group-media-toggle">
        <label>FONTE DA MÍDIA</label>
        <div class="toggle-row">
          <button type="button" class="toggle-btn active" id="toggle-upload">UPLOAD</button>
          <button type="button" class="toggle-btn" id="toggle-link">LINK PÚBLICO</button>
        </div>
      </div>

      <div class="form-group" id="group-file">
        <label for="file">ARQUIVO (Imagem ou Vídeo)</label>
        <input type="file" id="file" />
      </div>

      <div class="form-group hidden" id="group-link">
        <label for="public-link">URL PÚBLICA</label>
        <input type="url" id="public-link" placeholder="https://..." />
        <p class="hint" id="link-hint">Cole o link público da imagem ou vídeo do YouTube.</p>
      </div>

      <button type="submit" id="submit-btn">ENVIAR PARA O SISTEMA</button>
      
      <div id="status">Aguardando arquivo...</div>
    </form>
  </div>

</body>
</html>
