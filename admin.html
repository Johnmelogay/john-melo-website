<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOHN MELO — ADMIN SYSTEM</title>
  <link rel="icon" type="image/png" href="./assets/face.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: #050505;
      color: #f0f0e8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      background: #111;
      padding: 40px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }
    h1 {
      margin-top: 0;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.05em;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: 10px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: #aaa;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #444;
      color: #f0f0e8;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-red);
    }
    input[type="file"] {
      background: #0a0a0a;
      padding: 10px;
      width: 100%;
      border: 1px dashed #444;
      box-sizing: border-box;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 15px;
      background: var(--accent-red);
      color: white;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #cc0000;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      text-align: center;
      font-family: monospace;
      color: #aaa;
    }
    .success {
      color: #00ff41 !important;
    }
    .error {
      color: #ff3333 !important;
    }
  </style>
  <script type="module" crossorigin src="./assets/admin-DBE3uqOG.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="./assets/firebase-multiplayer-kLE0Tx7F.js">
  <link rel="stylesheet" crossorigin href="./assets/portfolio-tmqn9zXj.css">
</head>
<body>
  <div class="admin-container">
    <h1>SYS_UPLOAD</h1>
    <form id="upload-form">
      
      <div class="form-group">
        <label for="category">CATEGORIA</label>
        <select id="category" required>
          <option value="artworks">ARTWORKS</option>
          <option value="videos">VIDEOS</option>
          <option value="photos">PHOTOS</option>
          <option value="audios">AUDIOS</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title">TÍTULO</label>
        <input type="text" id="title" placeholder="Nome da obra" required />
      </div>

      <div class="form-group">
        <label for="description">DESCRIÇÃO (Opcional)</label>
        <textarea id="description" rows="3" placeholder="Ano, material, contexto..."></textarea>
      </div>

      <div class="form-group">
        <label for="file">ARQUIVO (Imagem, Vídeo ou Áudio)</label>
        <input type="file" id="file" required />
      </div>

      <button type="submit" id="submit-btn">ENVIAR PARA O SISTEMA</button>
      
      <div id="status">Aguardando arquivo...</div>
    </form>
  </div>

</body>
</html>
